services:
  signaling:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: misaka-signaling
    restart: unless-stopped
    environment:
      PORT: 9080
      MAX_NODES: 10000
      RATE_LIMIT_PER_MIN: 60
    expose:
      - "9080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9080/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2
    container_name: misaka-caddy
    restart: unless-stopped
    depends_on:
      signaling:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
