name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Default working directory is repo root; sub-projects are invoked via the
# top-level `npm test` orchestrator.
jobs:
  server-tests:
    name: Server (unit + integration + turn)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Shallow clone is enough for the test jobs. Only the guard job below
        # needs full history to diff against origin/<base>.

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Run server tests
        working-directory: server
        run: npm test

  client-tests:
    name: Client (unit + contract)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Type check (src)
        working-directory: client
        run: npm run typecheck

      # tsconfig.json only includes src/, so vite/vitest/playwright configs
      # were never type-checked and a broken build config could merge green.
      - name: Type check (build + test configs)
        working-directory: client
        run: npm run typecheck:config

      - name: Type check (unit + E2E tests)
        working-directory: client
        run: npm run typecheck:tests

      - name: Run client unit + contract tests
        working-directory: client
        run: npm test

  client-build:
    name: Client (production bundle + deployment base)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client deps
        working-directory: client
        run: npm ci

      # PRs used to only typecheck + test; Vite/Rollup/PostCSS/Tailwind
      # build-time regressions therefore only surfaced after merge, in the
      # Pages deploy workflow (CONFIG-008).
      - name: Build production bundle (default base)
        working-directory: client
        run: npm run build

      # CONFIG-005: asset base, router base and the Pages 404 redirect all
      # derive from one Vite `base`. Build under a subpath and prove they
      # agree — a regression here is invisible in a root-hosted build.
      - name: Subpath deployment smoke check
        working-directory: client
        env:
          VITE_BASE: /subpath-smoke/
        run: |
          set -e
          npm run build:subpath
          out=dist-subpath-smoke
          echo "-- 404 redirect target --"
          grep -q "var base = '/subpath-smoke/'" "$out/404.html"
          echo "-- no unsubstituted token --"
          ! grep -q '%BASE_URL%' "$out/404.html"
          echo "-- assets under the subpath --"
          grep -q '"/subpath-smoke/assets/' "$out/index.html"
          echo "-- manifest/icon under the subpath --"
          grep -q '"/subpath-smoke/manifest.webmanifest"' "$out/index.html"
          echo "-- no root-absolute leakage --"
          if grep -oE '(href|src)="/[^"]*"' "$out/index.html" | grep -v '"/subpath-smoke/'; then
            echo "::error::a root-absolute URL escaped the deployment base"
            exit 1
          fi
          echo "-- runtime BASE_URL baked into the bundle --"
          grep -rq '/subpath-smoke/' "$out/assets"
          echo "subpath smoke check OK"

  e2e-tests:
    name: E2E (Playwright, two-peer transfer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install client deps
        working-directory: client
        run: npm ci

      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Install Playwright browsers
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: client
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 7

  # Floor: src/ changes must touch tests/. A real patch-coverage gate is
  # added below so a comment-only test change cannot satisfy the guard alone.
  tests-touched-guard:
    name: Guard — src/ changes must touch tests/
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}

      - name: Run guard
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/guard-tests-touched.mjs

  # Coverage floor for core server modules. Thresholds start at today's
  # baseline and must only ratchet upward.
  server-coverage:
    name: Server coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server deps
        working-directory: server
        run: npm ci
      - name: Build
        working-directory: server
        run: npm run build
      - name: Install c8 + run real coverage gate
        working-directory: server
        # Real multi-test coverage via coverage-runner.mjs (each test is a
        # real child process; c8 merges V8 coverage). --per-file enforces
        # thresholds on every included module; check-changed-line-coverage
        # scores executable lines touched by the PR diff.
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
          MIN_CHANGED_PCT: '60'
        run: |
          set -e
          npm ci
          npm run build
          npx c8 \
            --include 'dist/ratelimit.js' \
            --include 'dist/store.js' \
            --include 'dist/ws.js' \
            --include 'dist/persist.js' \
            --include 'dist/origin.js' \
            --include 'dist/session-lifecycle.js' \
            --reporter=text \
            --reporter=text-summary \
            --reporter=json \
            --reports-dir=coverage \
            --check-coverage \
            --per-file \
            --lines 40 \
            --statements 40 \
            --functions 35 \
            --branches 25 \
            node tests/coverage-runner.mjs \
              tests/ratelimit-sliding.test.mjs \
              tests/occupied-scrypt.test.mjs \
              tests/pending-auth-cap.test.mjs \
              tests/persist-validation.test.mjs \
              tests/activity-broadcast-scale.test.mjs \
              tests/tombstone-cleanup.test.mjs \
              tests/origin-lockdown.test.mjs \
              tests/release-terminates.test.mjs \
              tests/session-renew.test.mjs
          node scripts/check-changed-line-coverage.mjs

  # Aggregate job so deploy (and branch protection) can require one check
  # that only goes green when every suite above succeeded.
  all-green:
    name: All tests green
    runs-on: ubuntu-latest
    needs: [server-tests, client-tests, client-build, e2e-tests, server-coverage]
    if: always()
    steps:
      - name: Check all required jobs
        run: |
          set -e
          echo "server-tests=${{ needs.server-tests.result }}"
          echo "client-tests=${{ needs.client-tests.result }}"
          echo "client-build=${{ needs.client-build.result }}"
          echo "e2e-tests=${{ needs.e2e-tests.result }}"
          echo "server-coverage=${{ needs.server-coverage.result }}"
          for r in \
            "${{ needs.server-tests.result }}" \
            "${{ needs.client-tests.result }}" \
            "${{ needs.client-build.result }}" \
            "${{ needs.e2e-tests.result }}" \
            "${{ needs.server-coverage.result }}"; do
            if [ "$r" != "success" ]; then
              echo "::error::required job did not succeed (got $r)"
              exit 1
            fi
          done
          echo "all required jobs green"
