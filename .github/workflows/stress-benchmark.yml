name: Transfer stress benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

jobs:
  byte-integrity-and-memory:
    name: 256 MiB byte integrity + streaming memory budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Run bounded stress benchmark
        working-directory: server
        env:
          STRESS_FILE_SIZE_MB: 256
          STRESS_STREAM_RSS_BUDGET_MB: 256
        run: npm run test:stress
