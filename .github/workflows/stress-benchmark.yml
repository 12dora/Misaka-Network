name: AES-GCM micro-benchmark (non-gating)

# This is a Node crypto micro-benchmark, NOT a product transfer / byte-integrity
# gate. Production transfer uses the browser engine at 252 KiB chunks; this job
# only measures synthetic AES-GCM throughput and RSS under a 64 KiB chunk size.
# Failures here are informational — they do not block merge or deploy.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

jobs:
  aes-gcm-microbench:
    name: Node AES-GCM micro-benchmark (non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Run AES-GCM micro-benchmark
        working-directory: server
        env:
          STRESS_FILE_SIZE_MB: 256
          STRESS_STREAM_RSS_BUDGET_MB: 256
        run: npm run test:stress
