name: Deploy to GitHub Pages

# Deploy ONLY after the Test workflow succeeds on main. No direct `push: main`
# path — a failing commit must never ship, and a passing commit must not
# double-deploy via both push and workflow_run.
on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]

# pages + id-token only — this workflow never writes to the repository.
permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Only deploy a successful Test run on main for a concrete head_sha.
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_sha != ''
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Guard — refuse deploy without exact tested head_sha
        run: |
          set -euo pipefail
          sha="${{ github.event.workflow_run.head_sha }}"
          if [ -z "$sha" ]; then
            echo "::error::workflow_run head_sha is empty"
            exit 1
          fi
          if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "::error::Test workflow did not succeed"
            exit 1
          fi
          echo "Deploying head_sha=$sha from successful Test run"

      - uses: actions/checkout@v4
        with:
          # Check out the exact tested commit — not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      # Must run BEFORE the build: its `base_path` output is the real path
      # this deployment will be served from — '/<repository-name>' for a
      # project site, '' for a user/org site or a custom domain. Feeding that
      # into VITE_BASE is what keeps asset URLs, the router basename and the
      # 404 redirect in agreement (CONFIG-005). Nothing here hard-codes the
      # repository name any more.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Resolve deployment base
        id: base
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          base="$PAGES_BASE_PATH"
          case "$base" in
            ""|"/") base="/" ;;
            *)      base="${base%/}/" ;;
          esac
          echo "Resolved VITE_BASE=$base"
          echo "vite_base=$base" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: cd client && npm ci

      - name: Build
        env:
          VITE_BASE: ${{ steps.base.outputs.vite_base }}
        run: cd client && npm run build

      - name: Assert built base is consistent
        env:
          VITE_BASE: ${{ steps.base.outputs.vite_base }}
        run: |
          set -e
          grep -q "var base = '${VITE_BASE}'" client/dist/404.html
          grep -q "${VITE_BASE}assets/" client/dist/index.html
          echo "base consistency OK for VITE_BASE=$VITE_BASE"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
