<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MISAKA NETWORK</title>
  <script>
    (function () {
      var repoBase = '/Misaka-Network';
      var base = location.hostname.endsWith('.github.io') &&
        (location.pathname === repoBase || location.pathname.indexOf(repoBase + '/') === 0)
        ? repoBase + '/'
        : '/';

      sessionStorage.setItem('misaka-redirect', location.pathname + location.search + location.hash);
      location.replace(base);
    })();
  </script>
</head>
<body>
  <a href="/">Go to MISAKA NETWORK</a>
</body>
</html>
