<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MISAKA NETWORK</title>
  <script>
    (function () {
      // `%BASE_URL%` is substituted at build time by the
      // `misaka-base-aware-404` plugin in vite.config.ts, using the SAME
      // Vite `base` that produced the asset URLs and the router basename —
      // so this redirect can never point somewhere the router doesn't serve.
      //
      // Seeing the literal token means the file was copied without a build,
      // or the build used a relative base; fall back to the origin root,
      // which is what a relative base means for routing anyway.
      var base = '%BASE_URL%';
      if (base.charAt(0) !== '/') base = '/';

      sessionStorage.setItem('misaka-redirect', location.pathname + location.search + location.hash);
      location.replace(base);
    })();
  </script>
</head>
<body>
  <a href="%BASE_URL%">Go to MISAKA NETWORK</a>
</body>
</html>
