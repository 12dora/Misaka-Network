<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/webp" href="/assets/misaka-logo.webp" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="御坂网络" />
  <title>御坂网络 · MISAKA NETWORK</title>
  <meta name="description" content="零注册、强隐私、跨设备的 P2P 文件传输网络" />
  <meta name="theme-color" content="#1A4FC4" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <!--
    Google Fonts — if blocked, system fonts in Tailwind config will take over.
    Both fonts load with font-display: swap so text shows immediately.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
    rel="stylesheet"
    media="print"
    onload="this.media='all'"
  />
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </noscript>
</head>
<body>
  <div id="root"></div>
  <!-- SPA redirect recovery (GitHub Pages 404 → index redirect) -->
  <script>
    (function(){
      var r = sessionStorage.getItem('misaka-redirect');
      if (r) { sessionStorage.removeItem('misaka-redirect'); history.replaceState(null,'',r); }
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
